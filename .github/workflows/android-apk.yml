name: Build BECHIR NOTE APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'store-launcher.svg'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Render exact store icon into Android resources
        run: |
          python3 -m pip install --user cairosvg
          mkdir -p android/app/src/main/res/drawable-nodpi
          python3 -c "import cairosvg; cairosvg.svg2png(url='store-launcher.svg',write_to='android/app/src/main/res/drawable-nodpi/store_launcher.png',output_width=432,output_height=432)"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-NOTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
